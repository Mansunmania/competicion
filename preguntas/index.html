<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flashcards - Carga por Asignatura</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 1rem;
      background: #020617;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    select, button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.9rem;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .viewer-panel {
      background: var(--card-bg);
      border-radius: 0.75rem;
      padding: 3rem;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    .card-context { font-size: 1.1rem; color: var(--muted); margin-bottom: 0.75rem; }
    .card-q { font-size: 2rem; font-weight: bold; margin-bottom: 1.5rem; line-height: 1.3; }
    .card-a { font-size: 1.5rem; color: #4ade80; display: none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); }
    .card-media img { max-width: 100%; max-height: 350px; border-radius: 0.5rem; margin-top: 1rem; }
    #statusNotice { margin-left: auto; font-size: 0.85rem; color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <label for="subjectSelect">📚 Asignatura:</label>
    <select id="subjectSelect">
      <option value="">-- Selecciona Asignatura --</option>
    </select>

    <select id="filterLvl" disabled><option value="">Todos los Niveles</option></select>
    <select id="filterCourse" disabled><option value="">Todos los Cursos</option></select>

    <span id="cardCounter">0 / 0</span>
    <span id="statusNotice">Cargando índice...</span>
  </header>

  <main>
    <section class="viewer-panel">
      <div class="card-context" id="displayContext"></div>
      <div class="card-q" id="displayQ">Selecciona una asignatura para empezar</div>
      <div class="card-media" id="displayMedia"></div>
      <div class="card-a" id="displayA"></div>
    </section>
  </main>

  <script>
    let subjectsIndex = [];
    let deck = [];
    let filtered = [];
    let index = 0;
    let showAnswer = false;

    // 1. Cargar solo el índice al arrancar (Casi instantáneo)
    async function init() {
      try {
        const res = await fetch('index.json');
        subjectsIndex = await res.json();
        
        const select = document.getElementById('subjectSelect');
        select.innerHTML = '<option value="">-- Selecciona Asignatura --</option>' +
          subjectsIndex.map(s => `<option value="${s.file}">${s.name}</option>`).join('');

        document.getElementById('statusNotice').innerText = "⚡ Listo (Selecciona asignatura)";
      } catch (err) {
        console.error(err);
        document.getElementById('statusNotice').innerText = "❌ Error al cargar index.json";
      }
    }

    // 2. Cargar el JSON de la asignatura elegida bajo demanda
    document.getElementById('subjectSelect').addEventListener('change', async (e) => {
      const filePath = e.target.value;
      if (!filePath) {
        deck = [];
        applyFilters();
        return;
      }

      document.getElementById('statusNotice').innerText = "⏳ Cargando asignatura...";
      document.getElementById('displayQ').innerText = "Cargando tarjetas...";

      try {
        const res = await fetch(filePath);
        deck = await res.json();
        
        document.getElementById('statusNotice').innerText = `✅ Cargadas ${deck.length} tarjetas`;
        
        populateSubFilters();
        applyFilters();
      } catch (err) {
        console.error(err);
        document.getElementById('statusNotice').innerText = "❌ Error al cargar la asignatura";
      }
    });

    function populateSubFilters() {
      const lvls = [...new Set(deck.map(c => c.lvl).filter(Boolean))];
      const courses = [...new Set(deck.map(c => c.course).filter(Boolean))];

      fillSelect('filterLvl', lvls, "Todos los Niveles");
      fillSelect('filterCourse', courses, "Todos los Cursos");

      document.getElementById('filterLvl').disabled = false;
      document.getElementById('filterCourse').disabled = false;
    }

    function fillSelect(id, values, defaultText) {
      const select = document.getElementById(id);
      select.innerHTML = `<option value="">${defaultText}</option>` + 
        values.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function applyFilters() {
      const l = document.getElementById('filterLvl').value;
      const c = document.getElementById('filterCourse').value;

      filtered = deck.filter(item => {
        return (!l || item.lvl === l) && (!c || item.course === c);
      });

      index = 0;
      showAnswer = false;
      renderCard();
    }

    function renderCard() {
      if (!filtered.length) {
        document.getElementById('displayQ').innerText = deck.length 
          ? "No hay tarjetas con este filtro" 
          : "Selecciona una asignatura";
        document.getElementById('displayContext').innerText = "";
        document.getElementById('displayA').style.display = "none";
        document.getElementById('displayMedia').innerHTML = "";
        document.getElementById('cardCounter').innerText = "0 / 0";
        return;
      }

      const card = filtered[index];
      document.getElementById('displayContext').innerText = card.qContext || "";
      document.getElementById('displayQ').innerText = card.q || "";
      
      const aEl = document.getElementById('displayA');
      aEl.innerText = card.a || "";
      aEl.style.display = showAnswer ? "block" : "none";

      const mediaEl = document.getElementById('displayMedia');
      if (card.media) {
        mediaEl.innerHTML = `<img src="${card.media}" alt="Media" />`;
      } else {
        mediaEl.innerHTML = "";
      }

      document.getElementById('cardCounter').innerText = `${index + 1} / ${filtered.length}`;
    }

    // Navegación con Mando / Teclado
    function nextCard() {
      if (index < filtered.length - 1) { index++; showAnswer = false; renderCard(); }
    }
    function prevCard() {
      if (index > 0) { index--; showAnswer = false; renderCard(); }
    }
    function toggleAnswer() {
      showAnswer = !showAnswer;
      renderCard();
    }

    document.addEventListener('keydown', (e) => {
      if (['input', 'select', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;
      
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextCard();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevCard();
      if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') toggleAnswer();
    });

    document.getElementById('filterLvl').onchange = applyFilters;
    document.getElementById('filterCourse').onchange = applyFilters;

    // Arrancar la app
    init();
  </script>
</body>
</html>
