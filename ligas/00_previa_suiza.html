<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fase Previa Suiza - Multiclase</title>
  <style>
    :root {
      --bg: #f4f7fb; --card: #ffffff; --ink: #1f2937; --muted: #6b7280;
      --line: #dbe3ee; --pri: #2563eb; --pri2: #1d4ed8; --ok: #16a34a;
      --warn: #d97706; --bad: #dc2626; --gold: #f59e0b; --silver: #94a3b8; --bronze: #b45309;
      --zone-div1: #f0fdf4; --zone-div2: #ffffff; --zone-div3: #fefce8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 12px 20px; background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; } header p { margin: 2px 0 0; opacity: 0.9; font-size: 13px; }
    
    .wrap { padding: 14px; max-width: 1600px; margin: 0 auto; }
    .grid-top { display: grid; grid-template-columns: 360px 1fr; gap: 14px; margin-bottom: 14px; }
    
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.04); }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    input[type="text"], textarea, select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; background: #fff; font: inherit; }
    
    button { border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; font-size: 13px; font: inherit; }
    .btn { background: var(--pri); color: #fff; } .btn:hover { background: var(--pri2); }
    .btn.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .btn.warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .btn.bad { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .btn.secondary { background: #e2e8f0; color: var(--ink); }
    .btn.undo { background: var(--warn); color: #fff; margin-top: 6px; width: 100%; text-align: center; }
    .btn.undo:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; border: 1px solid #d1d5db; opacity: 0.6; }

    .match-box { display: flex; flex-direction: column; gap: 8px; background: #f8fafc; border: 1px dashed var(--line); padding: 10px; border-radius: 10px; }
    .goal-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: #fff; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; }
    .counter-box { display: inline-flex; align-items: center; gap: 6px; }
    .btn-counter { background: #f1f5f9; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }
    .counter-value { font-size: 16px; font-weight: 800; min-width: 18px; text-align: center; color: var(--pri); }

    .dual-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .columns-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 5px 3px; border-bottom: 1px solid var(--line); text-align: center; font-size: 11px; }
    th { font-size: 9px; color: var(--muted); text-transform: uppercase; background: #f8fafc; }
    th:nth-child(2), td:nth-child(2) { text-align: left; font-weight: 600; }
    .rank { font-weight: 800; width: 20px; }
    .gold { color: var(--gold); } .silver { color: var(--silver); } .bronze { color: var(--bronze); }
    
    .match-list { display: flex; flex-direction: column; gap: 4px; max-height: 520px; overflow-y: auto; }
    .match-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fafcff; font-size: 12px; cursor: pointer; }
    .match-item:hover { background: #eef2ff; }
    .match-item.done { opacity: 0.55; background: #f8fafc; }
    .pill { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #eef2ff; color: #3730a3; font-weight: bold; }

    .tie-ctrl { display: inline-flex; gap: 2px; align-items: center; }
    .btn-tie { padding: 0 4px; font-size: 10px; border-radius: 3px; background: #f1f5f9; border: 1px solid var(--line); cursor: pointer; }
    
    .legend { display: flex; gap: 12px; font-size: 11px; font-weight: bold; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-box { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }
    
    .group-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .status-tag { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: #dcfce7; color: #166534; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🏆 Previa Suiza (Clasificatoria)</h1>
    <p>Emparejamientos equilibrados y clasificación por categorías</p>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="status-tag" id="autosaveStatus">⏳ Cargando...</span>
    <button class="btn secondary" onclick="initDataCascade()">🔄 Cargar de Drive</button>
    <button class="btn secondary" id="exportAll">📥 Exportar (JSON)</button>
    <button class="btn secondary" onclick="document.getElementById('importFile').click()">📤 Importar</button>
    <input id="importFile" type="file" accept="application/json" style="display:none" />
  </div>
</header>

<div class="wrap">
  <div class="grid-top">
    <div class="panel">
      <div class="group-box">
        <label>Seleccionar Competición / Clase</label>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <select id="groupSelect" style="font-weight:bold;"></select>
          <button class="btn secondary" id="renameGroupBtn" title="Renombrar la competición seleccionada">✏️</button>
        </div>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <input type="text" id="newGroupName" placeholder="Ej: 5ºA EF - 2026/09" />
          <button class="btn ok" id="addGroupBtn" style="white-space:nowrap;">+ Nueva</button>
        </div>
        <button class="btn bad" id="deleteGroupBtn" style="width:100%; font-size:11px; padding:4px 8px;">🗑️ Eliminar Clase Seleccionada</button>
      </div>

      <label>Alumnos (1 por línea)</label>
      <textarea id="studentsInput" rows="4" placeholder="Pega los nombres aquí..."></textarea>
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-top:6px; align-items:end;">
        <div>
          <label>Nº Partidos/Alumno</label>
          <select id="matchesPerStudentSelect">
            <option value="4" selected>4 partidos</option>
            <option value="6">6 partidos</option>
            <option value="8">8 partidos</option>
          </select>
        </div>
        <button class="btn ok" id="saveStudents">💾 Guardar Lista</button>
      </div>

      <button class="btn warn" id="generateMatches" style="width:100%; margin-top:6px;">🎲 Generar Sorteo</button>
    </div>

    <div class="panel">
      <label>Partido Seleccionado / Marcador en Directo</label>
      <div id="matchBox" class="match-box">
        <div style="text-align:center; color:var(--muted); font-size:13px;">Haz clic en un partido para anotar el resultado.</div>
      </div>
    </div>
  </div>

  <div class="dual-container">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="margin:0;">📊 Clasificación General</label>
        <div class="legend">
          <div class="legend-item"><div class="legend-box" style="background:var(--zone-div1)"></div> 1ª Div</div>
          <div class="legend-item"><div class="legend-box" style="background:var(--zone-div2)"></div> 2ª Div</div>
          <div class="legend-item"><div class="legend-box" style="background:var(--zone-div3)"></div> 3ª Div</div>
        </div>
        <span id="standingsCount" style="font-size:11px; color:var(--muted); font-weight:bold;">0 Alumnos</span>
      </div>
      <div class="columns-2">
        <table>
          <thead>
            <tr><th>#</th><th>Alumno</th><th>PTS</th><th>Des.</th><th>V-E-D</th><th>GF</th><th>GC</th><th>DIF</th></tr>
          </thead>
          <tbody id="standingsBody1"></tbody>
        </table>
        <table>
          <thead>
            <tr><th>#</th><th>Alumno</th><th>PTS</th><th>Des.</th><th>V-E-D</th><th>GF</th><th>GC</th><th>DIF</th></tr>
          </thead>
          <tbody id="standingsBody2"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="margin:0;">📅 Calendario de Partidos</label>
        <span id="matchProgress" style="font-size:11px; color:var(--muted); font-weight:bold;">0 / 0 Partidos</span>
      </div>
      <div class="columns-2">
        <div id="matchList1" class="match-list"></div>
        <div id="matchList2" class="match-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Configuración de rutas remotas y variables globales
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUIijdWpsEBlYr2VYRrIsozuyXgS4Q32fkzuYxG-szocv4pb5-KLiaVDgH4tErXTUzbA/exec";
const LOCAL_STORAGE_KEY = 'previa_suiza_db_v1';
const GITHUB_FALLBACK_URL = '../datos/00_previa_suiza.json';
const DEFAULT_FILENAME = '00_previa_suiza.json';

let historyStack = [];
let currentA = 0, currentB = 0;
let db = {
  activeGroup: "Clase 1",
  groups: {
    "Clase 1": { students: [], matches: [], tieBreakers: {}, currentMatchId: null, maxMatches: 4, updatedAt: Date.now() }
  }
};

function uid() {
  return Math.random().toString(36).substr(2, 9);
}

function getNowFormatted() {
  const d = new Date();
  return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
}

function getActiveData() {
  if (!db.groups || Object.keys(db.groups).length === 0) {
    db.groups = { "Clase 1": { students: [], matches: [], tieBreakers: {}, currentMatchId: null, maxMatches: 4, updatedAt: Date.now() } };
    db.activeGroup = "Clase 1";
  }
  if (!db.activeGroup || !db.groups[db.activeGroup]) {
    db.activeGroup = Object.keys(db.groups)[0];
  }
  return db.groups[db.activeGroup];
}

async function initDataCascade() {
  setSyncStatus('⏳ Cargando...');

  // 1. Intentar cargar desde Google Drive
  if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("https://script.google.com")) {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?file=${DEFAULT_FILENAME}`);
      const result = await res.json();
      if (result.success && result.data && result.data.groups) {
        db = result.data;
        saveLocal();
        setSyncStatus('☁️ Sincronizado (Drive)');
        finishLoad();
        return;
      }
    } catch (e) {
      console.warn("No se pudo conectar con Drive, buscando alternativos:", e);
    }
  }

  // 2. Intentar cargar desde LocalStorage
  const rawLocal = localStorage.getItem(LOCAL_STORAGE_KEY);
  if (rawLocal) {
    try {
      const parsed = JSON.parse(rawLocal);
      if (parsed.groups && Object.keys(parsed.groups).length > 0) {
        db = parsed;
        setSyncStatus('💾 Cargado (Local)');
        finishLoad();
        return;
      }
    } catch (e) {}
  }

  // 3. Intentar cargar desde GitHub
  try {
    const res = await fetch(GITHUB_FALLBACK_URL);
    if (res.ok) {
      const data = await res.json();
      if (data.groups) {
        db = data;
        saveLocal();
        setSyncStatus('🐙 Cargado (GitHub)');
        finishLoad();
        return;
      }
    }
  } catch (e) {
    console.warn("No se pudo cargar de GitHub:", e);
  }

  // 4. Si todo falla, modo local básico
  setSyncStatus('⚠️ Modo local básico');
  finishLoad();
}

function finishLoad() {
  getActiveData();
  updateGroupSelector();
  render();
}

function saveLocal() {
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(db));
}

function save() {
  const state = getActiveData();
  state.updatedAt = Date.now();
  saveLocal();
}

function setSyncStatus(text) {
  const el = document.getElementById('autosaveStatus');
  if (el) el.textContent = text;
}

function pushHistory() {
  historyStack.push(JSON.stringify(db));
  updateUndoButton();
}

function updateUndoButton() {
  const btn = document.getElementById('btnUndo');
  if (!btn) return;
  btn.disabled = historyStack.length === 0;
  btn.textContent = historyStack.length > 0 ? `↩️ Deshacer Último Marcador (${historyStack.length})` : `↩️ Deshacer Último Marcador`;
}

function updateGroupSelector() {
  const select = document.getElementById('groupSelect');
  select.innerHTML = '';
  
  const sortedNames = Object.keys(db.groups).sort((a, b) => {
    return (db.groups[b].updatedAt || 0) - (db.groups[a].updatedAt || 0);
  });

  sortedNames.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === db.activeGroup) opt.selected = true;
    select.appendChild(opt);
  });
}

function generateSchedule(students, maxMatches) {
  if (students.length < 2) return [];
  
  let matches = [];
  let pairs = new Map();
  let homeCount = {}, awayCount = {}, totalMatches = {};
  
  students.forEach(s => { 
    homeCount[s] = 0; 
    awayCount[s] = 0; 
    totalMatches[s] = 0; 
  });

  const targetMatchesPerStudent = maxMatches;
  let attempts = 0;
  
  while (attempts < 5000) {
    attempts++;
    let pool = students.filter(s => totalMatches[s] < targetMatchesPerStudent);
    if (pool.length < 2) break;

    pool.sort((a, b) => totalMatches[a] - totalMatches[b]);
    let a = pool[0];
    
    let candidateB = pool.slice(1).filter(b => {
      let key1 = `${a}||${b}`, key2 = `${b}||${a}`;
      return !pairs.has(key1) && !pairs.has(key2);
    });

    if (candidateB.length === 0) {
      candidateB = pool.slice(1);
    }

    if (candidateB.length > 0) {
      candidateB.sort((b1, b2) => {
        let times1 = (pairs.get(`${a}||${b1}`) || 0) + (pairs.get(`${b1}||${a}`) || 0);
        let times2 = (pairs.get(`${a}||${b2}`) || 0) + (pairs.get(`${b2}||${a}`) || 0);
        return times1 - times2;
      });

      let b = candidateB[0];
      let home = a, away = b;
      if (homeCount[a] > awayCount[a] || awayCount[b] > homeCount[b]) {
        home = b; away = a;
      }

      let pairKey = `${home}||${away}`;
      pairs.set(pairKey, (pairs.get(pairKey) || 0) + 1);
      
      homeCount[home]++; awayCount[away]++;
      totalMatches[home]++; totalMatches[away]++;

      matches.push({ id: uid(), a: home, b: away, result: null });
    }
  }

  return matches;
}

function recalc() {
  const state = getActiveData();
  let map = {};
  if (!state.tieBreakers) state.tieBreakers = {};
  state.students.forEach(s => {
    map[s] = { name: s, pts: 0, v: 0, e: 0, d: 0, gf: 0, gc: 0, p: 0, extra: parseFloat(state.tieBreakers[s]) || 0 };
  });

  state.matches.forEach(m => {
    if (m.result) {
      let A = map[m.a], B = map[m.b];
      if (!A || !B) return;
      A.p++; B.p++;
      let parts = m.result.split('-').map(Number);
      let gA = parts[0], gB = parts[1];

      A.gf += gA; A.gc += gB;
      B.gf += gB; B.gc += gA;

      A.pts += gA; B.pts += gB;

      if (gA > gB) { A.v++; B.d++; }
      else if (gB > gA) { B.v++; A.d++; }
      else { A.e++; B.e++; }
    }
  });

  return Object.values(map).sort((x, y) => {
    if (y.pts !== x.pts) return y.pts - x.pts;
    if (y.extra !== x.extra) return y.extra - x.extra;
    let difX = x.gf - x.gc, difY = y.gf - y.gc;
    if (difY !== difX) return difY - difX;
    if (y.gf !== x.gf) return y.gf - x.gf;
    return x.name.localeCompare(y.name);
  });
}

function renderStandings() {
  const ranked = recalc();
  const total = ranked.length;
  document.getElementById('standingsCount').textContent = `${total} Alumnos`;

  const base = Math.floor(total / 3);
  const remainder = total % 3;
  const div1Count = base + (remainder >= 1 ? 1 : 0);
  const div2Count = base + (remainder === 2 ? 1 : 0);

  const tbody1 = document.getElementById('standingsBody1');
  const tbody2 = document.getElementById('standingsBody2');
  tbody1.innerHTML = ''; tbody2.innerHTML = '';

  const half = Math.ceil(total / 2);

  ranked.forEach((r, i) => {
    const tr = document.createElement('tr');
    const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const safeName = r.name.replace(/'/g, "\\'");
    const extraText = r.extra > 0 ? `+${r.extra}` : r.extra;
    const diff = r.gf - r.gc;
    const diffText = diff > 0 ? `+${diff}` : diff;

    if (i < div1Count) tr.style.backgroundColor = 'var(--zone-div1)';
    else if (i < div1Count + div2Count) tr.style.backgroundColor = 'var(--zone-div2)';
    else tr.style.backgroundColor = 'var(--zone-div3)';

    tr.innerHTML = `
      <td class="rank ${medal}">${i + 1}</td>
      <td>${r.name}</td>
      <td><strong style="color:var(--pri)">${r.pts}</strong></td>
      <td>
        <div class="tie-ctrl">
          <button class="btn-tie" onclick="modifyTiebreaker('${safeName}', -0.1)">-</button>
          <span>${extraText}</span>
          <button class="btn-tie" onclick="modifyTiebreaker('${safeName}', 0.1)">+</button>
        </div>
      </td>
      <td style="font-size:10px; color:var(--muted);">${r.v}-${r.e}-${r.d}</td>
      <td>${r.gf}</td>
      <td style="color:var(--muted);">${r.gc}</td>
      <td><strong>${diffText}</strong></td>
    `;

    if (i < half) tbody1.appendChild(tr);
    else tbody2.appendChild(tr);
  });
}

function modifyTiebreaker(student, amt) {
  pushHistory();
  const state = getActiveData();
  if (!state.tieBreakers) state.tieBreakers = {};
  let cur = parseFloat(state.tieBreakers[student]) || 0;
  state.tieBreakers[student] = Math.round((cur + amt) * 10) / 10;
  save(); renderStandings();
}

function renderMatches() {
  const state = getActiveData();
  const list1 = document.getElementById('matchList1');
  const list2 = document.getElementById('matchList2');
  list1.innerHTML = ''; list2.innerHTML = '';

  const doneCount = state.matches.filter(m => m.result).length;
  document.getElementById('matchProgress').textContent = `${doneCount} / ${state.matches.length} Jugados`;

  const half = Math.ceil(state.matches.length / 2);

  state.matches.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = `match-item ${m.result ? 'done' : ''}`;
    let res = m.result ? `<strong style="color:var(--ok)">${m.result}</strong>` : `<span class="pill">Jugar</span>`;
    div.innerHTML = `<span><strong>${m.a}</strong> vs <strong>${m.b}</strong></span> ${res}`;
    
    div.onclick = () => {
      state.currentMatchId = m.id;
      currentA = 0; currentB = 0;
      save(); renderMatchEditor();
    };

    if (i < half) list1.appendChild(div);
    else list2.appendChild(div);
  });
}

function renderMatchEditor() {
  const state = getActiveData();
  const box = document.getElementById('matchBox');
  const match = state.matches.find(m => m.id === state.currentMatchId) || state.matches.find(m => !m.result);

  if (!match) {
    box.innerHTML = `
      <div style="text-align:center; color:var(--ok); font-weight:bold; font-size:13px;">🏆 ¡Fase de Clasificación Completa!</div>
      <button id="btnUndo" class="btn undo" disabled>↩️ Deshacer Último Marcador</button>
    `;
    setupUndoHandler();
    return;
  }

  state.currentMatchId = match.id;

  box.innerHTML = `
    <div style="font-size:11px; font-weight:bold; color:var(--muted); text-align:center; text-transform:uppercase;">Partido Seleccionado</div>
    <div class="goal-row">
      <span><strong>${match.a}</strong></span>
      <div class="counter-box">
        <button class="btn-counter" onclick="changeGoal('A', -1)">-</button>
        <span class="counter-value" id="valA">${currentA}</span>
        <button class="btn-counter" onclick="changeGoal('A', 1)">+</button>
      </div>
    </div>
    <div class="goal-row">
      <span><strong>${match.b}</strong></span>
      <div class="counter-box">
        <button class="btn-counter" onclick="changeGoal('B', -1)">-</button>
        <span class="counter-value" id="valB">${currentB}</span>
        <button class="btn-counter" onclick="changeGoal('B', 1)">+</button>
      </div>
    </div>
    <button class="btn ok" id="saveGoalBtn" style="width:100%;">⚽ Guardar Marcador</button>
    <button id="btnUndo" class="btn undo" disabled>↩️ Deshacer Último Marcador</button>
  `;

  document.getElementById('saveGoalBtn').onclick = () => {
    pushHistory();
    match.result = `${currentA}-${currentB}`;
    state.currentMatchId = null;
    currentA = 0; currentB = 0;
    save(); render();
  };

  setupUndoHandler();
}

function setupUndoHandler() {
  const btn = document.getElementById('btnUndo');
  if (btn) {
    btn.onclick = () => {
      if (historyStack.length === 0) return;
      db = JSON.parse(historyStack.pop());
      save(); updateGroupSelector(); render();
    };
  }
  updateUndoButton();
}

function changeGoal(team, amt) {
  if (team === 'A') currentA = Math.max(0, currentA + amt);
  else currentB = Math.max(0, currentB + amt);
  document.getElementById('valA').textContent = currentA;
  document.getElementById('valB').textContent = currentB;
}

function render() {
  const state = getActiveData();
  document.getElementById('studentsInput').value = (state.students || []).join('\n');
  if (state.maxMatches) document.getElementById('matchesPerStudentSelect').value = state.maxMatches;
  renderStandings();
  renderMatches();
  renderMatchEditor();
}

document.getElementById('addGroupBtn').onclick = () => {
  const input = document.getElementById('newGroupName');
  let name = input.value.trim();
  
  if (!name) {
    name = `Clase - ${getNowFormatted()}`;
  } else if (!name.includes('-')) {
    name = `${name} (${getNowFormatted().split(' ')[0]})`;
  }

  if (!db.groups[name]) {
    db.groups[name] = { 
      students: [], matches: [], tieBreakers: {}, currentMatchId: null, maxMatches: 4, updatedAt: Date.now() 
    };
  }
  db.activeGroup = name;
  input.value = '';
  save(); 
  updateGroupSelector(); 
  render();
};

document.getElementById('renameGroupBtn').onclick = () => {
  const oldName = db.activeGroup;
  const newName = prompt(`Nuevo nombre para la competición:`, oldName);
  if (newName && newName.trim() !== '' && newName !== oldName) {
    const cleanName = newName.trim();
    pushHistory();
    db.groups[cleanName] = db.groups[oldName];
    delete db.groups[oldName];
    db.activeGroup = cleanName;
    save(); 
    updateGroupSelector(); 
    render();
  }
};

document.getElementById('deleteGroupBtn').onclick = () => {
  if (Object.keys(db.groups).length <= 1) { 
    alert("Debes tener al menos una competición creada."); 
    return; 
  }
  if (confirm(`¿Estás seguro de eliminar permanentemente "${db.activeGroup}"?`)) {
    pushHistory();
    delete db.groups[db.activeGroup];
    db.activeGroup = Object.keys(db.groups)[0];
    save(); 
    updateGroupSelector(); 
    render();
  }
};

document.getElementById('groupSelect').onchange = (e) => { 
  db.activeGroup = e.target.value; 
  save(); 
  render(); 
};

document.getElementById('saveStudents').onclick = () => {
  const state = getActiveData();
  state.students = [...new Set(document.getElementById('studentsInput').value.split(/\n+/).map(s => s.trim()).filter(Boolean))];
  state.maxMatches = parseInt(document.getElementById('matchesPerStudentSelect').value, 10) || 4;
  save(); 
  render();
  alert(`Lista guardada correctamente.`);
};

document.getElementById('generateMatches').onclick = () => {
  const state = getActiveData();
  if (state.students.length < 2) { alert('Añade al menos 2 alumnos.'); return; }
  const maxMatches = parseInt(document.getElementById('matchesPerStudentSelect').value, 10) || 4;
  if (confirm(`¿Generar un nuevo sorteo de ${maxMatches} partidos por alumno para "${db.activeGroup}"?`)) {
    historyStack = [];
    state.maxMatches = maxMatches;
    state.matches = generateSchedule(state.students, maxMatches);
    state.tieBreakers = {};
    state.currentMatchId = state.matches[0]?.id || null;
    save(); 
    render();
  }
};

document.getElementById('exportAll').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); 
  a.href = URL.createObjectURL(blob); 
  a.download = DEFAULT_FILENAME; 
  a.click();
};

document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; 
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    pushHistory();
    if (data.groups) {
      db = data;
      saveLocal(); 
      setSyncStatus('📂 Archivo local');
      updateGroupSelector(); 
      render();
      alert('Todas las competiciones han sido importadas con éxito.');
    } else {
      alert('El archivo cargado no tiene una estructura multiclase válida.');
    }
  } catch(err) { alert('Archivo JSON no válido.'); }
  e.target.value = '';
});

// Inicialización
initDataCascade();
</script>
</body>
</html>
