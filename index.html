<script>
const STORAGE_KEY = 'classroom_cards_deck_v4';
const STORAGE_TOPICS_KEY = 'classroom_cards_topics_v4';

const CELEBRATION_GIFS = {
  "Fácil": { url: "https://media.tenor.com/YyKNQ-UFO8gAAAAM/the-simpsons-lisa-simpson.gif", caption: "¡Lisa aprueba tu respuesta! ⭐" },
  "Medio": { url: "https://media.tenor.com/EvNCyjP1IxQAAAAM/feliz-alegre.gif", caption: "¡Donkey aprueba tu respuesta! 🐴" },
  "Difícil": { url: "https://media.tenor.com/m4k271sucqgAAAAM/shrek-and-fiona-shrek.gif", caption: "¡Brillante! ¡Nivel Shrek y Fiona dominado! 👹" }
};

let deck = [];
let filterCourse = 'ALL';
let filterSubj = 'ALL';
let filterLvl = 'ALL';
let selectedTopics = []; 
let confirmedTopics = []; 
let customTopics = [];
let filtered = [];
let index = 0;
let filterMemory = {};

const BASE_COURSES = ["5º", "6º"];

/* SÍNTESIS DE AUDIO REALISTA CON WEB AUDIO API */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playCardSlide() {
  initAudio();
  const bufferSize = audioCtx.sampleRate * 0.12;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
  filter.Q.value = 1.2;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start();
}

function playArpa() {
  initAudio();
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 

  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const startTime = audioCtx.currentTime + (i * 0.04);

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);

    gain.gain.setValueAtTime(0.15, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(startTime);
    osc.stop(startTime + 0.3);
  });
}

document.addEventListener('click', () => initAudio(), { once: true });

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function parseInputItems(inputStr) {
  if (!inputStr) return [];
  return inputStr.split(',').map(t => t.trim()).filter(Boolean);
}

function getCardTopics(card) {
  if (Array.isArray(card.topics)) return card.topics.map(t => t.trim()).filter(Boolean);
  if (Array.isArray(card.topic)) return card.topic.map(t => t.trim()).filter(Boolean);
  if (typeof card.topic === 'string' && card.topic.trim() !== "") {
    return card.topic.split(',').map(t => t.trim()).filter(Boolean);
  }
  return [];
}

function getCardCourses(card) {
  if (!card.course || card.course.trim() === "") return [];
  return card.course.split(',').map(c => c.trim()).filter(Boolean);
}

function getAllAvailableTopics() {
  const allTopics = new Set(customTopics);
  deck.forEach(c => getCardTopics(c).forEach(t => allTopics.add(t)));
  return Array.from(allTopics).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
}

function getAllAvailableCourses() {
  const allCourses = new Set(BASE_COURSES);
  deck.forEach(c => getCardCourses(c).forEach(crs => allCourses.add(crs)));
  return Array.from(allCourses).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
}

function saveDeck() { localStorage.setItem(STORAGE_KEY, JSON.stringify(deck)); }
function saveTopics() { 
  customTopics.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
  localStorage.setItem(STORAGE_TOPICS_KEY, JSON.stringify(customTopics)); 
}

async function loadDeck() {
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmsFEuwrNg7QV3lEB9V2BuH8RkfpOOnrwEPZdVQ8dRbAaEbJkqRGVIOGwTprSPHUO5Hg/exec';
  let origenCargado = "";
  let cargadoConExito = false;

  try {
    const resDrive = await fetch(APPS_SCRIPT_URL, { redirect: 'follow' });
    if (!resDrive.ok) throw new Error(`Status: ${resDrive.status}`);
    const dataDrive = await resDrive.json();
    if (Array.isArray(dataDrive) && dataDrive.length > 0) {
      procesarMazo(dataDrive);
      origenCargado = "☁️ Google Drive";
      cargadoConExito = true;
    }
  } catch (errDrive) {
    console.warn("Fallo al cargar desde Drive via Apps Script:", errDrive);
  }

  if (!cargadoConExito) {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { 
      try { 
        let parsed = JSON.parse(raw); 
        if (Array.isArray(parsed) && parsed.length > 0) {
          procesarMazo(parsed);
          origenCargado = "💾 Memoria Local (LocalStorage)";
          cargadoConExito = true;
        }
      } catch(e) {} 
    }
  }

  if (!cargadoConExito) {
    try {
      const resLocal = await fetch('preguntas.json?v=' + new Date().getTime());
      if (!resLocal.ok) throw new Error('No se encontró preguntas.json local');
      const dataLocal = await resLocal.json();
      if (Array.isArray(dataLocal) && dataLocal.length > 0) {
        procesarMazo(dataLocal);
        origenCargado = "📁 GitHub (preguntas.json)";
        cargadoConExito = true;
      }
    } catch (errLocal) {
      console.warn("Fallo al cargar preguntas.json desde GitHub/local:", errLocal);
    }
  }

  const rawTopics = localStorage.getItem(STORAGE_TOPICS_KEY);
  if (rawTopics) {
    try { 
      customTopics = JSON.parse(rawTopics); 
      customTopics.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
    } catch(e) {}
  }

  mostrarAvisoOrigen(origenCargado);
  applyFilters();
}

function procesarMazo(datos) {
  deck = datos.map(c => {
    if (c.course === "Ambos (General)") c.course = "";
    c.qContext = c.qContext || "";
    c.topics = getCardTopics(c);
    c.topic = c.topics.join(', ');
    c.media = c.media || "";
    return c;
  });

  deck.forEach(c => {
    c.topics.forEach(t => {
      if (!customTopics.includes(t)) customTopics.push(t);
    });
  });
}

function mostrarAvisoOrigen(texto) {
  let badge = document.getElementById('data-source-badge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'data-source-badge';
    badge.style.cssText = 'position:fixed; bottom:10px; right:10px; background:#1e293b; color:#94a3b8; border:1px solid #334155; padding:4px 10px; border-radius:20px; font-size:11px; z-index:9999; pointer-events:none; opacity:0.85;';
    document.body.appendChild(badge);
  }
  badge.textContent = `Fuente: ${texto || 'Desconocida'}`;
}

function toggleFullscreen(e) {
  if (e) e.stopPropagation();
  const cardEl = document.getElementById('cardElement');
  const btn = document.getElementById('btnToggleFullscreen');
  
  cardEl.classList.toggle('fullscreen');
  if (cardEl.classList.contains('fullscreen')) {
    btn.textContent = '❌ Salir Fullscreen';
  } else {
    btn.textContent = '🖥️ Pantalla Completa';
  }
}

function navCard(e, dir) {
  if (e) e.stopPropagation();
  if (!filtered.length) return;
  playCardSlide();
  index = (index + dir + filtered.length) % filtered.length;
  updateView();
}

document.addEventListener('keydown', (e) => {
  const cardEl = document.getElementById('cardElement');
  const isFs = cardEl.classList.contains('fullscreen');
  const isEditingText = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || 
                        document.activeElement.isContentEditable;
  
  if (!isFs || isEditingText) return;

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    navCard(null, 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    navCard(null, -1);
  } else if (e.key === 'Escape') {
    toggleFullscreen(null);
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    handleCardClick(cardEl);
  }
});

function setupMultiAutocomplete(inputId, menuId, getAvailableItems) {
  const input = document.getElementById(inputId);
  const menu = document.getElementById(menuId);

  function renderMenu() {
    const fullText = input.value;
    const parts = fullText.split(',');
    const lastPart = parts[parts.length - 1];
    const currentTerm = lastPart.trim().toLowerCase();

    const existingItems = parts.slice(0, parts.length - 1).map(p => p.trim().toLowerCase());
    const available = getAvailableItems().filter(item => !existingItems.includes(item.toLowerCase()));
    
    const matches = currentTerm === "" 
      ? available 
      : available.filter(item => item.toLowerCase().includes(currentTerm));

    if (matches.length === 0) {
      menu.classList.remove('open');
      return;
    }

    let html = "";
    matches.forEach(item => {
      html += `<div class="notion-item" data-val="${item}">📌 ${item}</div>`;
    });
    menu.innerHTML = html;

    menu.querySelectorAll('.notion-item[data-val]').forEach(el => {
      el.onmousedown = (e) => {
        e.preventDefault();
        const selected = el.getAttribute('data-val');
        const currentParts = input.value.split(',').map(p => p.trim());
        currentParts[currentParts.length - 1] = selected;
        const cleaned = currentParts.filter(Boolean);
        input.value = cleaned.join(', ') + ', ';
        renderMenu();
        input.focus();
      };
    });
  }

  input.onfocus = () => { renderMenu(); menu.classList.add('open'); };
  input.onblur = () => { setTimeout(() => menu.classList.remove('open'), 150); };
  input.oninput = () => { renderMenu(); menu.classList.add('open'); };
}

function renderCourseFilterButtons() {
  const container = document.getElementById('courseFilterGroup');
  const activeCourses = new Set(BASE_COURSES);
  deck.forEach(card => getCardCourses(card).forEach(c => activeCourses.add(c)));

  const sortedActive = Array.from(activeCourses).sort((a, b) => 
    a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'})
  );

  let html = `<button class="filter-btn ${filterCourse === 'ALL' ? 'active' : ''}" onclick="setCourse('ALL')">Todos los cursos</button>`;
  sortedActive.forEach(c => {
    html += `<button class="filter-btn ${filterCourse === c ? 'active' : ''}" onclick="setCourse('${c}')">${c}</button>`;
  });
  container.innerHTML = html;
}

function matchesCourseFilter(card, selectedCourseFilter) {
  if (selectedCourseFilter === 'ALL') return true;
  const cardCourses = getCardCourses(card);
  if (cardCourses.length === 0) return true;
  return cardCourses.includes(selectedCourseFilter);
}

function renderTopicControls() {
  const topicsVisibles = new Set();
  let hayPreguntasSinTema = false;

  deck.forEach(card => {
    if (matchesCourseFilter(card, filterCourse) && (filterSubj === 'ALL' || card.subj === filterSubj)) {
      const cardTopics = getCardTopics(card);
      if (cardTopics.length > 0) cardTopics.forEach(t => topicsVisibles.add(t));
      else hayPreguntasSinTema = true;
    }
  });

  const container = document.getElementById('topicFilterGroup');
  let html = "";
  
  if (hayPreguntasSinTema) {
    const isSelected = selectedTopics.includes('NONE');
    html += `<button class="btn-special ${isSelected ? 'selected' : ''}" onclick="toggleTopicSelection('NONE')">${isSelected ? '✓ ' : ''}🔍 Sin tema asignado</button>`;
  }
  
  Array.from(topicsVisibles).sort((a,b) => a.localeCompare(b,'es',{sensitivity:'base'})).forEach(t => {
    const isSelected = selectedTopics.includes(t);
    html += `<button class="btn-topic ${isSelected ? 'selected' : ''}" onclick="toggleTopicSelection('${t.replace(/'/g, "\\'")}')">${isSelected ? '✓ ' : ''}${t}</button>`;
  });

  container.innerHTML = html;
  updateTopicConfirmZone();
}

function toggleTopicSelection(topic) {
  if (selectedTopics.includes(topic)) {
    selectedTopics = selectedTopics.filter(t => t !== topic);
  } else {
    selectedTopics.push(topic);
  }
  if (selectedTopics.length === 0) { confirmedTopics = []; applyFilters(); }
  else renderTopicControls();
}

function clearTopicSelection() { selectedTopics = []; confirmedTopics = []; applyFilters(); }

function toggleSelectAllTopics() {
  const visibleTopics = [];
  deck.forEach(card => {
    if (matchesCourseFilter(card, filterCourse) && (filterSubj === 'ALL' || card.subj === filterSubj)) {
      getCardTopics(card).forEach(t => { if(!visibleTopics.includes(t)) visibleTopics.push(t); });
    }
  });

  if (selectedTopics.length === visibleTopics.length) {
    selectedTopics = []; confirmedTopics = []; applyFilters();
  } else {
    selectedTopics = [...visibleTopics]; renderTopicControls();
  }
}

function updateTopicConfirmZone() {
  const confirmZone = document.getElementById('topicConfirmZone');
  const pillsPreview = document.getElementById('topicPillsPreview');
  const countSpan = document.getElementById('selectedTopicsCount');

  if (selectedTopics.length === 0) { confirmZone.style.display = 'none'; return; }

  confirmZone.style.display = 'flex';
  countSpan.textContent = selectedTopics.length;

  let html = "";
  selectedTopics.forEach(t => html += `<span class="pill-preview">${(t === 'NONE') ? 'Sin tema' : t}</span>`);
  pillsPreview.innerHTML = html;
}

function confirmTopicSelection() { confirmedTopics = [...selectedTopics]; applyFilters(); }

document.getElementById('addTopicBtn').onclick = (e) => {
  e.preventDefault();
  const input = document.getElementById('newTopicInput');
  const name = input.value.trim();
  if(!name) return;
  if(customTopics.includes(name)) { alert("Este tema ya existe."); return; }
  customTopics.push(name); saveTopics(); input.value = ''; applyFilters();
};

function setCourse(val) { filterCourse = val; applyFilters(); }
function setSubj(val) { filterSubj = val; applyFilters(); }
function setLvl(val) { filterLvl = val; applyFilters(); }

function updateVisualFilterButtons() {
  document.querySelectorAll('[id^="btnSubj-"]').forEach(b => b.classList.remove('active'));
  const activeSubjBtn = document.getElementById(`btnSubj-${filterSubj}`);
  if (activeSubjBtn) activeSubjBtn.classList.add('active');

  document.querySelectorAll('[id^="btnLvl-"]').forEach(b => b.classList.remove('active'));
  const activeLvlBtn = document.getElementById(`btnLvl-${filterLvl}`);
  if (activeLvlBtn) activeLvlBtn.classList.add('active');
  
  renderCourseFilterButtons(); renderTopicControls(); 
}

function applyFilters() {
  updateVisualFilterButtons();
  filtered = deck.filter(card => {
    const matchCourse = matchesCourseFilter(card, filterCourse);
    const matchSubj = (filterSubj === 'ALL' || card.subj === filterSubj);
    const matchLvl = (filterLvl === 'ALL' || card.lvl === filterLvl);
    
    let matchTopic = true;
    if (confirmedTopics.length > 0) {
      const cardTopics = getCardTopics(card);
      matchTopic = confirmedTopics.some(t => (t === 'NONE') ? cardTopics.length === 0 : cardTopics.includes(t));
    }
    return matchCourse && matchSubj && matchLvl && matchTopic;
  });

  const memoryKey = `${filterCourse}|${filterSubj}|${filterLvl}|${confirmedTopics.join(',')}`;
  index = (filterMemory[memoryKey] !== undefined && filterMemory[memoryKey] < filtered.length) ? filterMemory[memoryKey] : 0;
  updateView();
}

function openMediaLink(e, url) { 
  e.stopPropagation(); 
  window.open(url, '_blank'); 
}

/* COMPRESIÓN DE IMÁGENES AL SUBIR */
function handleImageUpload(inputElement, targetInputId) {
  const file = inputElement.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      const maxDim = 1200;

      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
      document.getElementById(targetInputId).value = compressedBase64;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function isImageUrl(urlStr) {
  if (!urlStr) return false;
  if (urlStr.startsWith('data:image/')) return true;
  return /\.(jpeg|jpg|gif|png|webp|svg)($|\?)/i.test(urlStr.trim());
}

function openImgModal(src) {
  const viewer = document.getElementById('imgModalViewer');
  viewer.src = src;
  document.getElementById('imgModal').classList.add('open');
}

function closeImgModal() {
  document.getElementById('imgModal').classList.remove('open');
}

function toggleImageZoom() {
  const modal = document.getElementById('imgModal');
  if (modal.classList.contains('open')) {
    closeImgModal();
  } else if (filtered.length) {
    const mediaUrl = (filtered[index].media || '').trim();
    if (isImageUrl(mediaUrl)) {
      openImgModal(mediaUrl);
    }
  }
}

function parseYouTubeUrl(urlStr) {
  if (!urlStr) return null;

  try {
    const url = new URL(urlStr.trim());
    let id = null;

    if (url.hostname === 'youtu.be') {
      id = url.pathname.slice(1);
    } else if (url.hostname.includes('youtube.com')) {
      id = url.searchParams.get('v');
      if (!id && url.pathname.startsWith('/embed/')) {
        id = url.pathname.split('/')[2];
      }
    }

    if (!id) return null;
    id = id.split('?')[0].split('&')[0];

    const timeParam = url.searchParams.get('t') || url.searchParams.get('start');
    let startSeconds = 0;

    if (timeParam) {
      const cleaned = timeParam.toLowerCase().replace('s', '');
      if (cleaned.includes('m')) {
        const parts = cleaned.split('m');
        const mins = parseInt(parts[0], 10) || 0;
        const secs = parseInt(parts[1], 10) || 0;
        startSeconds = (mins * 60) + secs;
      } else {
        startSeconds = parseInt(cleaned, 10) || 0;
      }
    }

    return { id, startSeconds };
  } catch (e) {
    return null;
  }
}

function syncRemoteData() {
  if (conn && conn.open && filtered.length > 0) {
    const currentCard = filtered[index];
    const mediaUrl = (currentCard.media || '').trim();
    const ytData = parseYouTubeUrl(mediaUrl);
    
    conn.send({
      type: 'CARD_SYNC',
      question: currentCard.q || '',
      answer: currentCard.a || '',
      hasImage: isImageUrl(mediaUrl),
      hasYt: !!ytData
    });
  }
}
  
function updateView() {
  const cardEl = document.getElementById('cardElement');
  const innerEl = document.getElementById('cardInnerElement');
  const wasFlipped = cardEl.classList.contains('flipped');
  
  if (wasFlipped && innerEl) innerEl.style.opacity = '0';
  cardEl.classList.remove('flipped');

  const counterEl = document.getElementById('cardCounter');
  const txtF = document.getElementById('textFront');
  const ctxF = document.getElementById('qContextFront');
  const ctxB = document.getElementById('qContextBack');
  const txtFB = document.getElementById('textFrontBack');
  const txtB = document.getElementById('textBack');
  const metaF = document.getElementById('metaFront');
  const topF = document.getElementById('topicFront');
  const topB = document.getElementById('topicBack');
  const mediaFront = document.getElementById('mediaAnchorFront');
  const mediaBack = document.getElementById('mediaAnchorBack');

  if (!filtered.length) {
    txtF.textContent = "No hay tarjetas con este filtro.";
    ctxF.textContent = ""; ctxB.textContent = ""; txtFB.textContent = "---"; txtB.textContent = "---";
    metaF.textContent = "VACÍO"; topF.textContent = "-"; topB.textContent = "-";
    counterEl.textContent = "0 / 0"; mediaFront.innerHTML = ""; mediaBack.innerHTML = "";
    if (innerEl) innerEl.style.opacity = '1';
    syncRemoteData();
    return;
  }

  setTimeout(() => {
    counterEl.textContent = `${index + 1} / ${filtered.length}`;
    const currentCard = filtered[index];
    
    ctxF.textContent = currentCard.qContext || '';
    ctxB.textContent = currentCard.qContext ? `(${currentCard.qContext})` : '';
    txtF.textContent = currentCard.q;
    txtFB.textContent = currentCard.q;
    txtB.textContent = currentCard.a;
    
    const cardCourses = getCardCourses(currentCard);
    const courseLabel = cardCourses.length > 0 ? cardCourses.join(', ') : "Todos";
    metaF.textContent = `[${courseLabel}] ${currentCard.subj} • ${currentCard.lvl}`;
    
    const cardTopics = getCardTopics(currentCard);
    const topicLabel = cardTopics.length > 0 ? `📌 ${cardTopics.join(', ')}` : "🔍 Sin tema";
    topF.textContent = topicLabel; topB.textContent = topicLabel;

    mediaFront.innerHTML = "";
    mediaBack.innerHTML = "";
    mediaBack.dataset.hasYt = "false";

    if (currentCard.media && currentCard.media.trim() !== "") {
      const mediaUrl = currentCard.media.trim();
      const ytData = parseYouTubeUrl(mediaUrl);

      if (ytData) {
        mediaBack.dataset.ytId = ytData.id;
        mediaBack.dataset.ytStart = ytData.startSeconds;
        mediaBack.dataset.hasYt = "true";
      } else if (isImageUrl(mediaUrl)) {
        const imgBtn = `<img src="${mediaUrl}" class="card-img-preview" onclick="event.stopPropagation(); openImgModal('${mediaUrl.replace(/'/g, "\\'")}')" title="Clic para maximizar" />`;
        mediaFront.innerHTML = imgBtn;
        mediaBack.innerHTML = imgBtn;
      } else {
        mediaBack.innerHTML = `<button class="btn-media" onclick="openMediaLink(event, '${mediaUrl.replace(/'/g, "\\'")}')">🔗 Abrir Enlace Web</button>`;
      }
    }
    
    document.getElementById('editQContext').value = currentCard.qContext || '';
    document.getElementById('editQ').value = currentCard.q;
    document.getElementById('editA').value = currentCard.a;
    document.getElementById('editSubj').value = currentCard.subj;
    document.getElementById('editLvl').value = currentCard.lvl;
    document.getElementById('editCourse').value = cardCourses.join(', ');
    document.getElementById('editTopic').value = cardTopics.join(', ');
    document.getElementById('editMedia').value = currentCard.media || '';
    
    document.getElementById('editTargetIndex').textContent = `Nº Global: ${deck.indexOf(currentCard) + 1}`;
    filterMemory[`${filterCourse}|${filterSubj}|${filterLvl}|${confirmedTopics.join(',')}`] = index;

    if (innerEl) innerEl.style.opacity = '1';
    syncRemoteData();
  }, wasFlipped ? 130 : 0);
}

function handleCardClick(cardElement) {
  cardElement.classList.toggle('flipped');
  const isFlipped = cardElement.classList.contains('flipped');
  const mediaBack = document.getElementById('mediaAnchorBack');

  if (isFlipped) {
    playArpa();

    if (mediaBack && mediaBack.dataset.hasYt === "true") {
      const id = mediaBack.dataset.ytId;
      const start = mediaBack.dataset.ytStart;
      const embedUrl = `https://www.youtube-nocookie.com/embed/${id}?start=${start}&autoplay=1&rel=0`;

      mediaBack.innerHTML = `
        <div id="ytVideoContainer" style="width: 100%; max-width: 320px; height: 180px; margin-top: 10px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; transition: all 0.3s ease; background: #000;" onclick="event.stopPropagation()">
          <div style="position: absolute; top: 6px; right: 6px; z-index: 50; display: flex; gap: 6px;">
            <button id="btnMinVideo" onclick="toggleMinVideo(event)" style="background: rgba(15,23,42,0.85); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;" title="Minimizar / Agrandar">👁️ Miniatura</button>
            <button onclick="closeVideo(event)" style="background: rgba(220,38,38,0.85); color: #fff; border: none; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;" title="Cerrar vídeo">❌</button>
          </div>
          <iframe 
            id="ytIframe"
            width="100%" 
            height="100%" 
            src="${embedUrl}" 
            title="YouTube video" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>`;
    }

    if (filtered.length) {
      const currentCard = filtered[index];
      if (currentCard.subj === 'Inglés') {
        const palabraLimpia = currentCard.a.trim();
        if (palabraLimpia.split(/\s+/).length <= 3) {
          setTimeout(() => speakBritish(palabraLimpia), 250);
        }
      }
    }
  } else {
    playCardSlide();
    if (mediaBack && mediaBack.dataset.hasYt === "true") {
      mediaBack.innerHTML = "";
    }
  }
}

function toggleMinVideo(e) {
  if (e) e.stopPropagation();
  const container = document.getElementById('ytVideoContainer');
  const btn = document.getElementById('btnMinVideo');
  if (!container) return;

  const isMin = container.dataset.minimized === "true";

  if (!isMin) {
    container.style.position = 'fixed';
    container.style.bottom = '20px';
    container.style.left = '20px';
    container.style.width = '160px';
    container.style.height = '90px';
    container.style.zIndex = '999';
    container.dataset.minimized = "true";
    if (btn) btn.textContent = '🎬 Ampliar';
  } else {
    container.style.position = 'relative';
    container.style.bottom = 'auto';
    container.style.left = 'auto';
    container.style.width = '100%';
    container.style.maxWidth = '320px';
    container.style.height = '180px';
    container.style.zIndex = 'auto';
    container.dataset.minimized = "false";
    if (btn) btn.textContent = '👁️ Miniatura';
  }
}

function closeVideo(e) {
  if (e) e.stopPropagation();
  const mediaBack = document.getElementById('mediaAnchorBack');
  if (mediaBack) mediaBack.innerHTML = "";
}

document.getElementById('celebrateBtn').onclick = (e) => {
  e.stopPropagation(); 
  if (!filtered.length) return;
  const currentCard = filtered[index];
  const gifData = CELEBRATION_GIFS[currentCard.lvl || "Fácil"];
  if (gifData) {
    const viewer = document.getElementById('gifViewer');
    viewer.src = ""; viewer.src = gifData.url;
    document.getElementById('gifCaption').textContent = gifData.caption;
    document.getElementById('gifModal').classList.add('open');
  }
};

function closeGifModal() { document.getElementById('gifModal').classList.remove('open'); }

function speakBritish(text) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  const ukVoice = window.speechSynthesis.getVoices().find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
  if (ukVoice) utterance.voice = ukVoice;
  utterance.lang = 'en-GB';
  window.speechSynthesis.speak(utterance);
}

document.getElementById('shuffleBtn').onclick = () => {
  if (!filtered.length) return;
  playCardSlide();
  shuffleArray(filtered); index = 0; updateView();
};

document.getElementById('updateBtn').onclick = () => {
  if (!filtered.length) return;
  const currentCard = filtered[index];
  currentCard.qContext = document.getElementById('editQContext').value.trim();
  currentCard.q = document.getElementById('editQ').value.trim();
  currentCard.a = document.getElementById('editA').value.trim();
  currentCard.subj = document.getElementById('editSubj').value;
  currentCard.lvl = document.getElementById('editLvl').value;
  currentCard.course = document.getElementById('editCourse').value.trim();
  currentCard.topics = parseInputItems(document.getElementById('editTopic').value);
  currentCard.topic = currentCard.topics.join(', ');
  currentCard.media = document.getElementById('editMedia').value.trim();
  saveDeck(); applyFilters();
};

document.getElementById('delBtn').onclick = () => {
  if (!filtered.length || !confirm("¿Seguro que deseas eliminar esta tarjeta?")) return;
  const globalIndex = deck.indexOf(filtered[index]);
  if (globalIndex > -1) { deck.splice(globalIndex, 1); saveDeck(); applyFilters(); }
};

document.getElementById('addBtn').onclick = () => {
  const q = document.getElementById('addQ').value.trim();
  const a = document.getElementById('addA').value.trim();
  if (!q || !a) { alert("Completa al menos la pregunta y la respuesta."); return; }

  const topics = parseInputItems(document.getElementById('addTopic').value);
  deck.push({
    qContext: document.getElementById('addQContext').value.trim(),
    q, a,
    subj: document.getElementById('addSubj').value,
    lvl: document.getElementById('addLvl').value,
    course: document.getElementById('addCourse').value.trim(),
    topics: topics, topic: topics.join(', '),
    media: document.getElementById('addMedia').value.trim()
  });

  saveDeck();
  document.getElementById('addQContext').value = '';
  document.getElementById('addQ').value = '';
  document.getElementById('addA').value = '';
  document.getElementById('addMedia').value = '';
  document.getElementById('addImgFile').value = '';
  applyFilters();
};

document.getElementById('exportBtn').onclick = () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(deck, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "preguntas.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click(); downloadAnchor.remove();
};

document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const importedData = JSON.parse(evt.target.result);
      if (Array.isArray(importedData)) { 
        procesarMazo(importedData); 
        saveDeck();
        mostrarAvisoOrigen("📁 Archivo importado manualmente");
        applyFilters(); 
        alert("¡Mazo importado con éxito!"); 
      }
    } catch(err) { alert("Archivo JSON no válido."); }
  };
  reader.readAsText(file);
};

setupMultiAutocomplete('addCourse', 'menuAdd', getAllAvailableCourses);
setupMultiAutocomplete('editCourse', 'menuEdit', getAllAvailableCourses);
setupMultiAutocomplete('addTopic', 'menuAddTopic', getAllAvailableTopics);
setupMultiAutocomplete('editTopic', 'menuEditTopic', getAllAvailableTopics);

function sendRemoteCmd(cmd) {
  if (conn) conn.send(cmd);
  if (navigator.vibrate) navigator.vibrate(40);
}

/* LÓGICA DE CONTROL REMOTO CON PEERJS */
let peer = null, conn = null;
const urlParams = new URLSearchParams(window.location.search);
const remoteTargetId = urlParams.get('remote');

if (remoteTargetId) {
  document.getElementById('appView').style.display = 'none';
  document.getElementById('remoteView').style.display = 'flex';
  peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
      ]
    }
  });

  peer.on('open', () => { 
    conn = peer.connect(remoteTargetId);
    conn.on('data', (data) => {
      if (data && data.type === 'CARD_SYNC') {
        document.getElementById('remoteQuestionText').textContent = data.question || 'Sin pregunta';
        document.getElementById('remoteAnswerText').textContent = data.answer || 'Sin respuesta';
        
        const imgBtn = document.getElementById('btnRemoteImgZoom');
        if (imgBtn) imgBtn.style.display = data.hasImage ? 'block' : 'none';

        const ytBtn = document.getElementById('btnRemoteYtMin');
        if (ytBtn) ytBtn.style.display = data.hasYt ? 'block' : 'none';
      }
    });
  });

} else {
  peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
      ]
    }
  });

  peer.on('open', (id) => {
    const remoteUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?remote=${id}`;
    const qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, { text: remoteUrl, width: 200, height: 200 });
  });

  peer.on('connection', (c) => {
    conn = c;
    conn.on('open', () => {
      syncRemoteData();
    });
    conn.on('data', (cmd) => {
      const cardEl = document.getElementById('cardElement');
      if (cmd === 'NEXT') navCard(null, 1);
      if (cmd === 'PREV') navCard(null, -1);
      if (cmd === 'FLIP') handleCardClick(cardEl);
      if (cmd === 'TOGGLE_ZOOM') toggleImageZoom();
      if (cmd === 'TOGGLE_MIN_VIDEO') toggleMinVideo();
    });
  });
}

function openQRModal() { 
  const qrModal = document.getElementById('qrModal');
  if (!qrModal.classList.contains('open')) {
    qrModal.classList.add('open');
  }
}
function closeQRModal() { document.getElementById('qrModal').classList.remove('open'); }
