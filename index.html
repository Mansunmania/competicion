<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mando de Control</title>

  <style>
    /* 1. ESTILOS GENERALES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 2. BOTONES PRINCIPALES DEL MANDO */
    .mando-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: #2b3a4a;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .mando-btn:active {
      transform: scale(0.98);
    }

    /* 3. PANEL PLEGABLE (ASIGNATURAS Y TEMAS) */
    .panel-oculto {
      display: none !important;
    }

    #panelSeleccion {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .seccion-bloque h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 8px;
    }

    .grid-botones {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
    }

    .btn-asignatura, .btn-tema {
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-asignatura { background-color: #007bff; }
    .btn-tema { background-color: #28a745; }

    .btn-asignatura:active, .btn-tema:active {
      opacity: 0.8;
    }

    /* 4. ENTRADA DE VÍDEO Y REPRODUCTOR */
    .control-video {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .control-video input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
    }

    .control-video button {
      padding: 12px 16px;
      font-weight: bold;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Contenedor adaptativo 16:9 para el iframe */
    .contenedor-iframe {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .contenedor-iframe iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. CONTROLES DEL MANDO                    -->
  <!-- ========================================== -->
  <button id="btnToggleMenu" class="mando-btn">📂 Seleccionar Tema / Asignatura</button>
  <button id="btnFullscreen" class="mando-btn">📱 Pantalla Completa</button>

  <!-- ========================================== -->
  <!-- 2. PANEL DESPLEGABLE (OCULTO POR DEFECTO)  -->
  <!-- ========================================== -->
  <div id="panelSeleccion" class="panel-oculto">
    
    <div class="seccion-bloque">
      <h3>Asignaturas</h3>
      <div class="grid-botones">
        <button class="btn-asignatura" data-asignatura="matematicas">Matemáticas</button>
        <button class="btn-asignatura" data-asignatura="lengua">Lengua</button>
        <button class="btn-asignatura" data-asignatura="ciencias">Ciencias</button>
      </div>
    </div>

    <div class="seccion-bloque">
      <h3>Temas</h3>
      <div class="grid-botones">
        <button class="btn-tema" data-tema="1">Tema 1</button>
        <button class="btn-tema" data-tema="2">Tema 2</button>
        <button class="btn-tema" data-tema="3">Tema 3</button>
      </div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- 3. ENTRADA Y REPRODUCTOR DE VÍDEO          -->
  <!-- ========================================== -->
  <div class="control-video">
    <input type="text" id="inputUrl" placeholder="Pega URL de YouTube o Short...">
    <button id="btnCargar">Cargar</button>
  </div>

  <div class="contenedor-iframe">
    <iframe id="reproductor" src="" allowfullscreen allow="autoplay"></iframe>
  </div>

  <!-- ========================================== -->
  <!-- 4. LÓGICA JAVASCRIPT                       -->
  <!-- ========================================== -->
  <script>
    // --- A. MOSTRAR / OCULTAR PANEL DE BOTONES ---
    const btnToggleMenu = document.getElementById('btnToggleMenu');
    const panelSeleccion = document.getElementById('panelSeleccion');

    btnToggleMenu.addEventListener('click', () => {
      panelSeleccion.classList.toggle('panel-oculto');
    });

    // --- B. CONTROL PANTALLA COMPLETA ---
    const btnFullscreen = document.getElementById('btnFullscreen');

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error al activar pantalla completa: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.textContent = document.fullscreenElement 
        ? '❌ Salir de Pantalla Completa' 
        : '📱 Pantalla Completa';
    });

    // --- C. TRANSFORMACIÓN DE URLS (INCLUYE YOUTUBE SHORTS) ---
    function obtenerUrlEmbed(url) {
      let videoId = '';

      if (url.includes('/shorts/')) {
        // Enlaces tipo: youtube.com/shorts/ID_DEL_VIDEO
        videoId = url.split('/shorts/')[1].split('?')[0];
      } else if (url.includes('v=')) {
        // Enlaces tipo: youtube.com/watch?v=ID_DEL_VIDEO
        videoId = url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        // Enlaces tipo: youtu.be/ID_DEL_VIDEO
        videoId = url.split('youtu.be/')[1].split('?')[0];
      }

      return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : url;
    }

    // Cargar enlace en iframe
    document.getElementById('btnCargar').addEventListener('click', () => {
      const urlOriginal = document.getElementById('inputUrl').value.trim();
      if (urlOriginal) {
        const urlEmbed = obtenerUrlEmbed(urlOriginal);
        document.getElementById('reproductor').src = urlEmbed;
      }
    });

    // --- D. CAPTURA DE CLICS EN ASIGNATURAS Y TEMAS ---
    document.querySelectorAll('.btn-asignatura').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const asignatura = e.target.dataset.asignatura;
        console.log('Asignatura seleccionada:', asignatura);
        // Añade aquí tu función para filtrar por asignatura
      });
    });

    document.querySelectorAll('.btn-tema').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tema = e.target.dataset.tema;
        console.log('Tema seleccionado:', tema);
        // Añade aquí tu función para cargar vídeos del tema
      });
    });
  </script>

</body>
</html>
